[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ustc-Genuine-NL2DSL2SQL"
version = "0.1.0"
description = "Archer text-to-SQL reproduction: generation + VA/EX evaluation"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["archer_eval", "model", "model.pipeline", "model.pipeline.stages"]
py-modules = ["config"]

[tool.setuptools.package-data]
"model.pipeline" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
